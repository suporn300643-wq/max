<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Digital Mixer + BLE (Prototype)</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">X-AIR Style Mixer (Demo)</div>
    <div class="actions">
      <button id="btnStart">เริ่มระบบเสียง</button>
      <button id="btnBLE">เชื่อมต่อบลูทูธ</button>
      <label class="filebtn">
        โหลดเสียงเข้าแชนแนล…
        <input id="fileInput" type="file" accept="audio/*" multiple />
      </label>
    </div>
  </header>

  <section class="racks">
    <div class="rack" id="gateRack">
      <h3>Noise Gate</h3>
      <label>Threshold <input type="range" id="gateThreshold" min="-100" max="0" step="1" value="-55"></label>
      <label>Attack (ms) <input type="range" id="gateAttack" min="0" max="200" step="1" value="3"></label>
      <label>Hold (ms) <input type="range" id="gateHold" min="0" max="500" step="1" value="30"></label>
      <label>Release (ms) <input type="range" id="gateRelease" min="10" max="1000" step="1" value="150"></label>
    </div>
    <div class="rack" id="compRack">
      <h3>Compressor</h3>
      <label>Threshold (dB) <input type="range" id="compThreshold" min="-100" max="0" step="1" value="-24"></label>
      <label>Ratio <input type="range" id="compRatio" min="1" max="20" step="0.1" value="3"></label>
      <label>Attack (s) <input type="range" id="compAttack" min="0" max="1" step="0.005" value="0.003"></label>
      <label>Release (s) <input type="range" id="compRelease" min="0" max="1" step="0.005" value="0.25"></label>
      <label>Knee (dB) <input type="range" id="compKnee" min="0" max="40" step="1" value="5"></label>
    </div>
    <div class="rack" id="eqRack">
      <h3>EQ</h3>
      <label>Low (80Hz) <input type="range" data-eq="low" min="-15" max="15" step="0.5" value="0"></label>
      <label>Mid (1kHz) <input type="range" data-eq="mid" min="-15" max="15" step="0.5" value="0"></label>
      <label>High (8kHz) <input type="range" data-eq="high" min="-15" max="15" step="0.5" value="0"></label>
    </div>
    <div class="rack" id="masterRack">
      <h3>Master</h3>
      <label>Master Volume <input type="range" id="masterGain" min="-60" max="6" step="0.5" value="0"></label>
      <label>Limiter (dB) <input type="range" id="limiterThreshold" min="-24" max="0" step="1" value="-1"></label>
      <div class="meters">
        <div>LR Meter</div>
        <progress id="meterL" max="1" value="0"></progress>
        <progress id="meterR" max="1" value="0"></progress>
      </div>
    </div>
  </section>

  <section class="mixer">
    <!-- Channels are injected by JS -->
  </section>

  <footer class="foot">
    <div>วิ่งบน WebAudio + WebBluetooth (ต้องเปิดด้วย HTTPS หรือ localhost)</div>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
